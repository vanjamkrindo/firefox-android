name: Build Fenix APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle variant (default debug = tanpa signing key)'
        required: false
        default: 'assembleFenixDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fenix-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: fenix-gradle-

      - name: Accept Android SDK licenses & install missing packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -30

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /

      - name: Build ${{ github.event.inputs.variant }}
        env:
          GRADLE_OPTS: '-Xmx6g -Dorg.gradle.daemon=false'
        run: |
          set -o pipefail
          ./gradlew ${{ github.event.inputs.variant }} --no-daemon --stacktrace 2>&1 | tail -120

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name '*.apk' -print -exec cp {} out/ \; 2>/dev/null | tail -20
          ls -lh out || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 7